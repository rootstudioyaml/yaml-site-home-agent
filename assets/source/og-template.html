<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;900&family=Oswald:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#161311;color:#f2ece5;
       font-family:"Noto Sans KR",sans-serif;position:relative}
  .photo{position:absolute;inset:0;background:url('PHOTO') center 46%/cover no-repeat}
  .photo::after{content:"";position:absolute;inset:0;
    background:linear-gradient(102deg,rgba(16,13,11,.96) 0%,rgba(16,13,11,.9) 46%,rgba(16,13,11,.6) 70%,rgba(16,13,11,.34) 100%),
               linear-gradient(180deg,rgba(16,13,11,.5) 0%,rgba(16,13,11,.18) 45%,rgba(16,13,11,.82) 100%)}
  .inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
         justify-content:center;align-items:flex-start;gap:34px;padding:0 84px}
  .mark{height:236px;width:auto;display:block}
  .area{display:flex;align-items:center;gap:20px}
  .area i{display:block;width:56px;height:2px;background:#c89a6a;flex:none}
  .area span{font-family:"Gothic A1","Noto Sans KR",sans-serif;font-weight:700;
             font-size:34px;letter-spacing:.02em;color:#f2ece5;white-space:nowrap;
             text-shadow:0 2px 18px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div class="photo"></div>
<div class="inner">
  <img class="mark" src="LOGOSRC" alt="제이하우징" />
  <div class="area"><i></i><span>서울 · 경기 · 인천 수도권 전 지역 시공</span></div>
</div>
</body>
</html>
